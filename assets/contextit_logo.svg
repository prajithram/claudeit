<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117" rx="12"/>

  <!-- === Brain / memory core — left side === -->
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>

  <!-- Brain circle base -->
  <circle cx="100" cy="100" r="52" fill="#161b22" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Brain folds — stylised with arcs -->
  <!-- Left hemisphere -->
  <path d="M 68 80 Q 58 100 68 120" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 72 72 Q 55 90 62 112" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right hemisphere -->
  <path d="M 132 80 Q 142 100 132 120" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>
  <path d="M 128 72 Q 145 90 138 112" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Center vertical split -->
  <line x1="100" y1="55" x2="100" y2="145" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Horizontal fold lines left -->
  <path d="M 75 88 Q 88 83 100 88" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 72 100 Q 86 95 100 100" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 75 112 Q 88 117 100 112" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Horizontal fold lines right -->
  <path d="M 125 88 Q 112 83 100 88" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 128 100 Q 114 95 100 100" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 125 112 Q 112 117 100 112" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pulse dot — memory active -->
  <circle cx="100" cy="100" r="5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="100" cy="100" r="9" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>

  <!-- === Connection lines — brain to files === -->
  <line x1="152" y1="78"  x2="195" y2="62"  stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="152" y1="100" x2="195" y2="100" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="152" y1="122" x2="195" y2="138" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- === Context file stack — right of brain === -->
  <!-- File 1 — stack.md -->
  <rect x="195" y="48" width="90" height="26" rx="4" fill="#161b22" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="195" y="48" width="20" height="26" rx="4" fill="#1d4ed8" opacity="0.6"/>
  <text x="207" y="65" font-size="9" fill="#93c5fd" font-weight="600" text-anchor="middle">S</text>
  <text x="232" y="62" font-size="8" fill="#94a3b8">stack.md</text>
  <rect x="222" y="66" width="55" height="2" rx="1" fill="#334155" opacity="0.6"/>

  <!-- File 2 — decisions.md -->
  <rect x="195" y="87" width="90" height="26" rx="4" fill="#161b22" stroke="#60a5fa" stroke-width="1.2"/>
  <rect x="195" y="87" width="20" height="26" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <text x="207" y="104" font-size="9" fill="#bfdbfe" font-weight="600" text-anchor="middle">D</text>
  <text x="232" y="101" font-size="8" fill="#e2e8f0">decisions.md</text>
  <rect x="222" y="105" width="55" height="2" rx="1" fill="#475569" opacity="0.6"/>

  <!-- File 3 — guardrails.md -->
  <rect x="195" y="126" width="90" height="26" rx="4" fill="#161b22" stroke="#3b82f6" stroke-width="1.2"/>
  <rect x="195" y="126" width="20" height="26" rx="4" fill="#1d4ed8" opacity="0.6"/>
  <text x="207" y="143" font-size="9" fill="#93c5fd" font-weight="600" text-anchor="middle">G</text>
  <text x="232" y="140" font-size="8" fill="#94a3b8">guardrails.md</text>
  <rect x="222" y="144" width="55" height="2" rx="1" fill="#334155" opacity="0.6"/>

  <!-- === Arrow — files to Claude session === -->
  <line x1="292" y1="100" x2="326" y2="100" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
  <polygon points="326,100 318,95 318,105" fill="#60a5fa" opacity="0.7"/>

  <!-- claudeit load label on arrow -->
  <text x="309" y="93" font-size="7.5" fill="#64748b" text-anchor="middle">claudeit load</text>

  <!-- === Claude session box === -->
  <rect x="332" y="58" width="138" height="84" rx="6" fill="#161b22" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Session header bar -->
  <rect x="332" y="58" width="138" height="20" rx="6" fill="#164e63"/>
  <rect x="332" y="68" width="138" height="10" fill="#164e63"/>
  <circle cx="346" cy="68" r="4" fill="#ef4444" opacity="0.7"/>
  <circle cx="360" cy="68" r="4" fill="#f59e0b" opacity="0.7"/>
  <circle cx="374" cy="68" r="4" fill="#22c55e" opacity="0.7"/>
  <text x="401" y="72" font-size="8" fill="#94a3b8" text-anchor="middle">Claude Code</text>

  <!-- Session content lines -->
  <text x="344" y="92" font-size="7.5" fill="#22d3ee">📦 Context loaded</text>
  <rect x="344" y="97" width="80" height="2" rx="1" fill="#334155"/>
  <rect x="344" y="103" width="60" height="2" rx="1" fill="#334155"/>
  <text x="344" y="116" font-size="7" fill="#4ade80">Stack · UI · Decisions</text>
  <text x="344" y="127" font-size="7" fill="#64748b">What are we working on?</text>
  <rect x="344" y="131" width="100" height="5" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>

  <!-- === Word mark === -->
  <!-- claudeit — single text, tspan for colour split, guaranteed no gap -->
  <text x="498" y="118" font-size="58" font-weight="700" letter-spacing="-2" text-anchor="start"><tspan fill="#f8fafc">claude</tspan><tspan fill="#3b82f6">it</tspan></text>

  <!-- Tagline -->
  <text x="498" y="140" font-size="14" fill="#64748b" letter-spacing="0.5" text-anchor="start">persistent project memory for Claude Code</text>

  <!-- Thin accent line under wordmark -->
  <line x1="498" y1="148" x2="775" y2="148" stroke="#1d4ed8" stroke-width="1" opacity="0.4"/>

  <!-- Version / mode badges -->
  <rect x="498" y="155" width="46" height="18" rx="9" fill="#1e3a5f"/>
  <text x="521" y="168" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="600">sctx</text>

  <rect x="552" y="155" width="46" height="18" rx="9" fill="#1e3a5f"/>
  <text x="575" y="168" font-size="9" fill="#60a5fa" text-anchor="middle" font-weight="600">dctx</text>

  <rect x="606" y="155" width="78" height="18" rx="9" fill="#0f2027"/>
  <text x="645" y="168" font-size="9" fill="#94a3b8" text-anchor="middle">Claude Code CLI</text>

</svg>
